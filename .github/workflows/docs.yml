name: Build and Deploy Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty to use docs/.version)'
        required: false
        default: ''

  repository_dispatch:
    types: [deploy-docs]

  push:
    branches:
      - docs
    paths:
      - 'docs/**'
      - 'src/mkdocs/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "docs-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch docs source from docs branch
        run: |
          echo "📥 Fetching docs source from docs branch..."
          git fetch origin docs:docs
          git checkout origin/docs -- docs/ src/
          echo "✅ Docs source ready"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          if [ -f "src/mkdocs/requirements.txt" ]; then
            pip install -r src/mkdocs/requirements.txt
          else
            pip install mkdocs mkdocs-shadcn mkdocs-gen-files mkdocs-literate-nav pymdown-extensions
          fi

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -f "docs/.version" ]; then
            VERSION=$(cat docs/.version | tr -d '[:space:]')
          else
            VERSION="v0.1.0"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

      # ==========================================
      # Build Documentation
      # ==========================================
      - name: Build documentation
        working-directory: src/mkdocs
        run: |
          echo "🏗️ Building MkDocs documentation..."
          # Set SITE_URL for this build (enables proper links)
          export SITE_URL="https://WCRP-CMIP.github.io/cmip7-guidance/"
          mkdocs build -f mkdocs.yml
          echo "✅ Build complete"

      # ==========================================
      # Deploy to Root AND Version Directory
      # ==========================================
      - name: Deploy to root and version directory
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "📦 Deploying to root and version directory..."
          
          # Clean old content from docs/
          rm -rf docs/*
          
          # Copy built site to root (current/latest version)
          cp -r src/mkdocs/site/* docs/
          
          # ALSO copy to version directory
          mkdir -p docs/versions/$VERSION
          cp -r src/mkdocs/site/* docs/versions/$VERSION/
          
          # Create/update versions.json manifest
          cat > docs/versions.json << EOF
          {
            "current": "$VERSION",
            "versions": [
              {
                "version": "$VERSION",
                "title": "$VERSION",
                "aliases": ["latest"]
              }
            ]
          }
          EOF
          
          # Create version redirect at /v.X.X.X/ (without /versions/ prefix)
          mkdir -p docs/$VERSION
          cat > docs/$VERSION/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=../versions/$VERSION/">
            <script>window.location.href = '../versions/$VERSION/';</script>
          </head>
          <body>Redirecting to version $VERSION...</body>
          </html>
          EOF
          
          sed -i "s/\$VERSION/$VERSION/g" docs/$VERSION/index.html
          
          echo "✅ Deployed to:"
          echo "   - Root: docs/"
          echo "   - Version: docs/versions/$VERSION/"
          echo "   - Redirect: docs/$VERSION/ → docs/versions/$VERSION/"

      - name: Commit to production
        run: |
          git add docs/
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "📚 Deploy documentation ${{ steps.version.outputs.version }}"
            git push origin production
            echo "✅ Changes committed to production"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Summary
        run: |
          echo "### 🚀 Documentation Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- Root: https://wcrp-cmip.github.io/cmip7-guidance/" >> $GITHUB_STEP_SUMMARY
          echo "- Version: https://wcrp-cmip.github.io/cmip7-guidance/versions/${{ steps.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
          echo "- Shortcut: https://wcrp-cmip.github.io/cmip7-guidance/${{ steps.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Deploy to GitHub Pages
  # ==========================================
  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### 📚 Pages Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
