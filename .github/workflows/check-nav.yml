name: Check navigation

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/scripts/check_nav.py'
      - '.github/workflows/check-nav.yml'
  push:
    branches:
      - docs
    paths:
      - 'docs/**'
      - '.github/scripts/check_nav.py'
      - '.github/workflows/check-nav.yml'

jobs:
  check-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check all docs pages are in nav_menu.md
        run: python .github/scripts/check_nav.py
